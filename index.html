const questions=[{"n": 1, "source": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024", "stem": "As demonstrações contábeis são normalmente elaboradas com base na suposição de que a entidade que reporta está em continuidade operacional. Desse modo, presume-se que a entidade não tem a intenção e nem a necessidade de", "options": [{"letter": "A", "text": "tornar-se internacional."}, {"letter": "B", "text": "modificar a sua atividade-fim."}, {"letter": "C", "text": "entrar em liquidação ou deixar de negociar."}, {"letter": "D", "text": "expandir os seus negócios para outras localidades."}], "key": "C", "comment": "Continuidade pressupõe ausência de intenção e necessidade de liquidar ou cessar operações. Internacionalização, expansão ou mudança de atividade não representam automaticamente descontinuidade. A alternativa C expressa a hipótese central da norma."}, {"n": 2, "source": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024", "stem": "Uma entidade deseja reconhecer um ativo em seu balanço patrimonial. A sua mensuração envolve estimativas que estão sujeitas a incertezas.\n\nNesse caso, a entidade", "options": [{"letter": "A", "text": "não deve reconhecer nem divulgar o ativo, uma vez que não há objetividade em sua mensuração."}, {"letter": "B", "text": "deve reconhecer o ativo sem mencionar a existência de estimativas, uma vez que estas foram elaboradas com zelo e são, portanto, confiáveis."}, {"letter": "C", "text": "não deve reconhecer o ativo, mas evidenciá-lo em notas explicativas, uma vez que não há espaço para incertezas nas demonstrações contábeis elaboradas."}, {"letter": "D", "text": "deve reconhecer o ativo e descrever e explicar as estimativas de forma clara e precisa, uma vez que o uso de estimativas razoáveis é parte essencial da elaboração de informações financeiras."}], "key": "D", "comment": "Estimativas razoáveis são parte essencial das informações financeiras. A incerteza de mensuração, por si só, não impede o reconhecimento; as estimativas e suas limitações devem ser descritas claramente. Isenção de erros diz respeito ao processo e à descrição, não à eliminação de toda incerteza."}, {"n": 3, "source": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024", "stem": "Em 2023, uma entidade desreconheceu um ativo de seu balanço patrimonial.\n\nAssinale a opção que indica uma possível causa para o desreconhecimento.", "options": [{"letter": "A", "text": "A entidade decidiu utilizar um terreno para finalidade diferente."}, {"letter": "B", "text": "A entidade perdeu o controle de um imóvel, por meio de decisão judicial."}, {"letter": "C", "text": "A entidade renegociou o prazo de recebimento de seus clientes, que estavam em situação financeira difícil."}, {"letter": "D", "text": "A entidade constatou que as suas máquinas poderiam ser utilizadas por tempo maior do que a vida útil prevista."}], "key": "B", "comment": "Ao perder o controle do imóvel por decisão judicial, a entidade pode deixar de atender à definição de ativo, justificando o desreconhecimento. Alterar a finalidade de um terreno, renegociar recebíveis ou revisar a vida útil não exige, por si só, retirar o ativo do balanço."}, {"n": 4, "source": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024", "stem": "De acordo com o conceito de manutenção de capital financeiro, o lucro é auferido somente se o montante financeiro (ou dinheiro) dos ativos líquidos no final do período exceder o montante financeiro (ou dinheiro) dos ativos líquidos no início do período, após excluir", "options": [{"letter": "A", "text": "compra e venda de ativos fixos durante o período."}, {"letter": "B", "text": "distribuições para, e contribuições de, sócios durante o período."}, {"letter": "C", "text": "reconhecimento contábil de receitas e de despesas durante o período."}, {"letter": "D", "text": "recebimento de receitas e pagamentos de despesas durante o período."}], "key": "B", "comment": "Para medir o lucro pela manutenção de capital financeiro, excluem-se distribuições aos sócios e contribuições deles. Exemplo: aumento do PL provocado por aporte não é lucro. Receitas e despesas participam do resultado; compras e vendas de ativos não são excluídas indistintamente."}, {"n": 5, "source": "FGV - Bach (CFC)/CFC/1º Exame de Suficiência/2024", "stem": "De acordo com a NBC TG Estrutura Conceitual - Estrutura Conceitual para Relatório Financeiro, os principais usuários aos quais se destinam os relatórios financeiros para fins gerais são representados por", "options": [{"letter": "A", "text": "empregados, clientes e fornecedores."}, {"letter": "B", "text": "detentores de participação societária e interessados em adquiri-la."}, {"letter": "C", "text": "população em geral, impactada direta e indiretamente pelos relatórios."}, {"letter": "D", "text": "investidores, credores por empréstimos e outros credores, existentes e potenciais."}], "key": "D", "comment": "Os usuários primários são investidores, credores por empréstimos e outros credores, existentes e potenciais. Empregados, clientes e público em geral podem ter interesse, mas não substituem esse conjunto. A norma contempla tanto quem já fornece recursos quanto quem pode vir a fornecê-los."}, {"n": 6, "source": "FGV - AGC (EPE)/EPE/Contabilidade/2024", "stem": "De acordo com o Pronunciamento Técnico CPC 00 (R2), a Estrutura Conceitual para Relatório Financeiro contribui para a missão de desenvolver pronunciamentos que tragam aos mercados financeiros", "options": [{"letter": "A", "text": "arrojamento, eficiência e comparabilidade."}, {"letter": "B", "text": "transparência, comparabilidade e exatidão."}, {"letter": "C", "text": "exatidão, redução de custos e conhecimento."}, {"letter": "D", "text": "prestação de contas, economia e arrojamento."}, {"letter": "E", "text": "transparência, prestação de contas e eficiência."}], "key": "E", "comment": "A missão indicada pela Estrutura Conceitual é contribuir para transparência, prestação de contas e eficiência nos mercados financeiros. Transparência melhora a informação; prestação de contas ajuda a avaliar a gestão; eficiência favorece a alocação de capital."}, {"n": 7, "source": "FGV - ATTM (Pref Nova Iguaçu)/Pref Nova Iguaçu/2024", "stem": "Os investidores, credores por empréstimos e outros credores existentes e potenciais são considerados os usuários principais, aos quais se destinam relatórios financeiros para fins gerais.\n\nDe acordo com a NBC TG Estrutura Conceitual - Estrutura Conceitual para Relatório Financeiro, a administração da entidade não é considerada usuário principal, uma vez que", "options": [{"letter": "A", "text": "tem como foco os relatórios gerenciais."}, {"letter": "B", "text": "apresenta, em geral, alta rotatividade."}, {"letter": "C", "text": "reporta-se diretamente aos diretores da entidade."}, {"letter": "D", "text": "pode obter internamente as informações financeiras de que precisa."}, {"letter": "E", "text": "não representa uma provedora de recursos essenciais para a sobrevivência da entidade."}], "key": "D", "comment": "A administração pode obter internamente as informações financeiras de que precisa e, por isso, não depende dos relatórios para fins gerais como os usuários primários. Não é a rotatividade nem a relação hierárquica que fundamenta essa distinção."}, {"n": 8, "source": "FGV - Ana Prev (MACAEPREV)/MACAEPREV/Contabilidade/2024", "stem": "De acordo com a NBC TG Estrutura Conceitual- Estrutura Conceitual para Relatório Financeiro, a Estrutura Conceitual estabelece a base para normas que reforçam a prestação de contas, reduzindo a lacuna de informações entre", "options": [{"letter": "A", "text": "o Governo e os órgãos reguladores."}, {"letter": "B", "text": "os órgãos reguladores e os elaboradores das demonstrações contábeis."}, {"letter": "C", "text": "os provedores de capital e as pessoas a quem confiaram o seu dinheiro."}, {"letter": "D", "text": "as entidades que elaboram o relatório financeiro e a auditoria externa."}, {"letter": "E", "text": "a auditoria externa e o público a que se destina o relatório financeiro."}], "key": "C", "comment": "A prestação de contas reduz a lacuna de informação entre provedores de capital e as pessoas a quem confiaram seu dinheiro. Os relatórios permitem avaliar a responsabilidade da administração pelo uso dos recursos. O foco não é a relação entre auditoria, Governo e reguladores."}, {"n": 9, "source": "FGV - Ana Prev (MACAEPREV)/MACAEPREV/Contabilidade/2024", "stem": "Em relação à conceituação dos elementos patrimoniais, assinale V para a afirmativa verdadeira e F para a falsa, de acordo com a Estrutura Conceitual:\n\n( ) Ativo é o recurso econômico presente controlado pela entidade como resultado de eventos passados.\n\n( ) Passivo é a obrigação presente da entidade de transferir um recurso econômico como resultado de eventos passados.\n\n( ) Patrimônio Líquido é a participação residual nas receitas da entidade após a dedução de todas as suas despesas.\n\nAs afirmativas são, respectivamente,", "options": [{"letter": "A", "text": "V – V – F."}, {"letter": "B", "text": "F – V – F."}, {"letter": "C", "text": "V – F – F."}, {"letter": "D", "text": "F – F – V."}, {"letter": "E", "text": "V – V – V."}], "key": "A", "comment": "Sequência: V – V – F. Ativo é recurso econômico presente controlado, resultante de eventos passados. Passivo é obrigação presente de transferir recurso econômico, também resultante de eventos passados. PL é residual nos ativos após deduzir passivos; receitas menos despesas correspondem ao resultado."}, {"n": 10, "source": "FGV - AJ (TJ RR)/TJ RR/Contabilidade/2024", "stem": "Em 2023, uma entidade realizou transações com instrumentos financeiros derivativos, que foram consideradas complexas.\n\nA entidade optou por não incluir essas transações em suas demonstrações contábeis, de modo a tornar mais fácil a compreensão das informações contidas em suas demonstrações.\n\nEm relação à aplicação direta das características qualitativas das informações financeiras úteis, é correto afirmar que as demonstrações contábeis", "options": [{"letter": "A", "text": "estão de acordo com a relevância."}, {"letter": "B", "text": "estão de acordo com a prudência."}, {"letter": "C", "text": "não estão de acordo com a tempestividade."}, {"letter": "D", "text": "não estão de acordo com a representação fidedigna."}, {"letter": "E", "text": "estão de acordo com a capacidade de verificação."}], "key": "D", "comment": "Excluir transações complexas torna a representação incompleta e compromete a representação fidedigna. A dificuldade de compreensão não autoriza omitir fatos relevantes. Assuntos complexos podem exigir explicações e auxílio especializado aos usuários."}, {"n": 11, "source": "FGV - AGP (Pref Vitória)/Pref Vitória/Contador/2024", "stem": "De acordo com a NBC TG Estrutura Conceitual - Estrutura Conceitual para Relatório Financeiro, os investidores, credores por empréstimos, e outros credores, existentes e potenciais, são os principais usuários aos quais se destinam relatórios financeiros para fins gerais. Em relação às informações fornecidas por estes relatórios aos usuários primários, é correto afirmar que os relatórios", "options": [{"letter": "A", "text": "fornecem todas as informações de que esses usuários necessitam."}, {"letter": "B", "text": "buscam fornecer todas as informações de que esses usuários necessitam, sendo que nem sempre é possível."}, {"letter": "C", "text": "não fornecem todas as informações de que esses usuários necessitam, no entanto, as normas contábeis estão sendo aprimoradas para que isso aconteça."}, {"letter": "D", "text": "não fornecem e nem podem fornecer todas as informações de que esses usuários necessitam, de modo que eles precisam considerar outras fontes."}, {"letter": "E", "text": "não fornecem e nem podem fornecer todas as informações de que esses usuários necessitam, de modo que eles precisam tirar as suas conclusões com base no que os relatórios divulgam."}], "key": "D", "comment": "Os relatórios não fornecem nem podem fornecer todas as informações necessárias. Os usuários também precisam considerar outras fontes, como condições econômicas, perspectivas do setor e ambiente político. Não se deve restringir a decisão apenas ao conteúdo divulgado nos relatórios."}];let page=0,selected=Array(11).fill(null),answers=Array(11).fill(null),soundOn=true,audioContext;

correctSound.preload="auto";wrongSound.preload="auto";
function stopSounds(){[correctSound,wrongSound].forEach(a=>{a.pause();a.currentTime=0})}
function tone(ok){stopSounds();if(!soundOn)return;const sound=ok?correctSound:wrongSound;sound.play().catch(()=>{});}
function render(){let correct=answers.filter((a,i)=>a===questions[i].key).length,done=answers.filter(Boolean).length;$('score').textContent=`${correct} acertos • ${done}/11 respondidas`;$('progress').style.width=(done/11*100)+'%';$('back').disabled=page===0;if(page===22){$('position').textContent='Quiz concluído';$('screen').innerHTML=`<h1>Resultado final</h1><p>Você acertou <strong>${correct} de 11</strong> questões (${Math.round(correct/11*100)}%).</p><p>Revise os comentários usando o botão Voltar ou reinicie para praticar novamente.</p><button type="button" class="whatsapp" id="sendWhatsapp">Enviar resultado ao Professor Moreira pelo WhatsApp</button><p class="hint">A mensagem será aberta no WhatsApp. Toque em Enviar para encaminhar seu resultado.</p>`;$('next').disabled=true;$('sendWhatsapp').onclick=sendResult;return}let i=Math.floor(page/2),q=questions[i],comment=page%2===1,answered=answers[i]!==null,ok=answers[i]===q.key;$('position').textContent=`Questão ${i+1}/11 • ${comment?'Comentário':'Responder'}`;$('next').disabled=!answered;$('next').textContent=comment?(i===10?'Ver resultado →':'Próxima questão →'):'Ver comentário →';let feedback=answered?`<div class="feedback" role="status"><span class="lamp ${ok?'green':'red'}" aria-hidden="true"></span><span>${ok?'✓ Você acertou!':'✕ Você errou.'}</span></div>`:'';let content=comment?`${feedback}<div class="answer"><strong>Gabarito: ${q.key}</strong><br>${esc(q.options.find(o=>o.letter===q.key).text)}</div><h2>Comentário</h2><div class="comment">${esc(q.comment)}</div>`:`<div class="stem">${esc(q.stem)}</div><div class="options">${q.options.map(o=>`<button class="option ${selected[i]===o.letter?'selected':''} ${answered&&o.letter===q.key?'good':''} ${answered&&answers[i]===o.letter&&!ok?'bad':''}" data-letter="${o.letter}" aria-pressed="${selected[i]===o.letter}" ${answered?'disabled':''}><strong>${o.letter})</strong><span>${esc(o.text)}</span></button>`).join('')}</div><button id="confirm" class="primary" ${answered||!selected[i]?'disabled':''}>${answered?'Resposta confirmada':'Confirmar resposta'}</button>${feedback}`;$('screen').innerHTML=`<h1>${comment?'Comentário da questão':'Questão'} ${q.n}</h1><div class="source">${esc(q.source)}</div>${content}`;document.querySelectorAll('[data-letter]').forEach(b=>b.onclick=()=>{selected[i]=b.dataset.letter;render()});if($('confirm'))$('confirm').onclick=()=>{if(answers[i]||!selected[i])return;answers[i]=selected[i];tone(answers[i]===q.key);render()}}

function sendResult(){
 const name=$('studentName').value.trim();
 if(!name){$('nameError').textContent='Informe seu nome para enviar o resultado.';$('studentName').focus();return;}
 $('nameError').textContent='';
 const correct=answers.filter((a,i)=>a===questions[i].key).length;
 const message=`Professor Moreira, sou ${name}.
Concluí o Quiz 4 — Estrutura Conceitual.
✅ Acertos: ${correct} de 11
❌ Erros: ${11-correct}
📊 Aproveitamento: ${Math.round(correct/11*100)}%`;
 const link=document.createElement('a');link.href='https://wa.me/5561985323574?text='+encodeURIComponent(message);link.target='_blank';link.rel='noopener noreferrer';document.body.appendChild(link);link.click();link.remove();
}
function move(delta){stopSounds();page=Math.max(0,Math.min(22,page+delta));render();window.scrollTo(0,0)}$('back').onclick=()=>move(-1);$('next').onclick=()=>{if(!$('next').disabled)move(1)};$('restart').onclick=()=>{if(answers.some(Boolean)&&!confirm('Reiniciar o quiz e apagar as respostas desta tentativa?'))return;stopSounds();page=0;selected.fill(null);answers.fill(null);render();window.scrollTo(0,0)};$('sound').onclick=()=>{soundOn=!soundOn;if(!soundOn)stopSounds();$('sound').textContent=soundOn?'🔊 Som ligado':'🔇 Som desligado';$('sound').setAttribute('aria-pressed',String(soundOn))};render();
</script></body></html>
